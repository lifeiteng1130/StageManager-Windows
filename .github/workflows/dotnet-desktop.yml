name: Build and test Windows portable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test StageManager.Tests/StageManager.Tests.csproj -c Release
      - name: Publish portable
        shell: pwsh
        run: ./publish-portable.ps1 -DotnetPath dotnet -OutputDirectory ./Artifacts
      - name: Verify published WPF startup
        shell: pwsh
        run: |
          $env:STAGEMANAGER_SELFTEST = '1'
          $process = Start-Process -FilePath ./Artifacts/StageManager.exe -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw 'Published app startup timed out'
          }
          if ($process.ExitCode -ne 0) { throw 'Published app startup failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: StageManager-Windows-x64-portable
          path: Artifacts/
